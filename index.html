<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sub-Merchant Payment Escrow Hub</title>
    <meta name="description" content="Multi-party payment escrow, automated fee withholding, milestone-based releases, and sub-merchant payout management." />
    <meta property="og:title" content="Sub-Merchant Payment Escrow Hub" />
    <meta property="og:description" content="Multi-party payment escrow, automated fee withholding, milestone-based releases, and sub-merchant payout management." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Gracefully handle HMR WebSocket connection transport in sandboxed preview iframe
      window.addEventListener(
        'error',
        function (event) {
          if (
            event.message &&
            (event.message.includes('WebSocket') ||
              event.message.includes('createWebSocketModuleRunnerTransport') ||
              event.message.includes('vite:ws'))
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        },
        true
      );
      window.addEventListener(
        'unhandledrejection',
        function (event) {
          if (
            event.reason &&
            (String(event.reason).includes('WebSocket') ||
              String(event.reason).includes('createWebSocketModuleRunnerTransport'))
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        },
        true
      );
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
